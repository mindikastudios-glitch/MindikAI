  --font-title: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sidebar-w: 288px;
}
[data-theme="dark"] {
  --bg: #17201a;
  --surface: #1f2b22;
  --sidebar: #131a15;
  --ink: #eef0dc;
  --muted: #9aa99c;
  --accent: #8fb394;
  --accent-strong: #a6c9ab;
  --accent-soft: #2a3a2d;
  --line: #2c3a2f;
  --shadow: 0 8px 30px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  transition: background .3s, color .3s;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: flex; height: 100dvh; overflow: hidden; }

/* ---------- Barra lateral ---------- */
.sidebar {
  width: var(--sidebar-w); flex: none; background: var(--sidebar);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
  padding: 18px 14px 14px; transition: transform .3s ease;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 18px; }
.brand-logo { width: 40px; height: auto; }
.brand-name { font-family: var(--font-title); font-weight: 600; font-size: 1.5rem; letter-spacing: .01em; color: var(--accent-strong); flex: 1; }

.new-chat {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--accent); color: #fff; font-weight: 700; padding: 12px 14px;
  border-radius: 14px; box-shadow: 0 4px 0 var(--accent-strong);
  transition: transform .12s, box-shadow .12s, background .2s;
}
.new-chat:hover { background: var(--accent-strong); }
.new-chat:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-strong); }

.history { flex: 1; overflow-y: auto; margin-top: 20px; }
.history-title { font-size: .8rem; font-weight: 700; color: var(--muted); padding: 0 8px 8px; }
.chat-item {
  display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 3px;
  border-radius: 12px; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .15s, padding-left .15s;
}
.chat-item:hover { background: var(--accent-soft); padding-left: 16px; }
.chat-item:active { background: var(--line); }
.chat-item.active { background: var(--accent-soft); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }

.sidebar-footer { display: flex; align-items: center; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.profile { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; text-align: left; transition: background .15s; }
.profile:hover { background: var(--accent-soft); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.profile-info { display: flex; flex-direction: column; line-height: 1.2; }
.profile-info small { color: var(--muted); }

.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); transition: background .15s, color .15s, transform .1s; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
.icon-btn:active { transform: scale(.92); }
.only-mobile { display: none; }

.scrim { display: none; }

/* ---------- Zona principal ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; gap: 10px; }
.status { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 6px 14px; border-radius: 99px; margin-right: auto; }
.only-mobile + .status { margin-left: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #5fb36b; box-shadow: 0 0 0 0 rgba(95, 179, 107, .6); animation: pulse 2.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(95, 179, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(95, 179, 107, 0); } }

.menu-wrap { position: relative; }
.popover { position: absolute; right: 0; top: 46px; min-width: 210px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 20; animation: pop .15s ease; transform-origin: top right; }
.popover button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 9px; font-size: .95rem; }
.popover button:hover { background: var(--accent-soft); }
.popover .danger { color: #b5473a; }
@keyframes pop { from { opacity: 0; transform: scale(.95); } }

.chat { flex: 1; overflow-y: auto; padding: 0 20px 20px; scroll-behavior: smooth; }

/* Bienvenida */
.welcome { max-width: 720px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px 0 40px; }
.welcome h1 { font-family: var(--font-title); font-weight: 600; font-size: clamp(3rem, 9vw, 5.2rem); line-height: 1; color: var(--accent); letter-spacing: .01em; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
.tagline { font-size: clamp(1.05rem, 2.4vw, 1.3rem); color: var(--muted); margin-top: 12px; animation: rise .8s .12s cubic-bezier(.2, .8, .2, 1) both; }
.ask { font-family: var(--font-title); font-weight: 500; font-size: clamp(1.4rem, 3.4vw, 1.9rem); margin: 38px 0 20px; animation: rise .8s .24s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 560px; animation: rise .8s .36s cubic-bezier(.2, .8, .2, 1) both; }
.card { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; text-align: left; font-weight: 700; transition: transform .15s, border-color .15s, box-shadow .15s; }
.card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.card:active { transform: translateY(0) scale(.98); }
.card-ico { font-size: 1.3rem; width: 38px; height: 38px; display: grid; place-items: center; background: var(--accent-soft); border-radius: 12px; }

/* Mensajes */
.messages { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding-top: 10px; }
.msg { display: flex; gap: 12px; animation: msgIn .35s ease both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } }
.msg .bubble { padding: 12px 16px; border-radius: 18px; line-height: 1.55; max-width: min(85%, 600px); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg .ai-ava { width: 36px; height: 36px; flex: none; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; }
.msg .ai-ava img { width: 24px; }
.typing { display: inline-flex; gap: 5px; padding: 6px 2px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 40% { transform: translateY(-6px); opacity: .5; } }

/* Caja de texto */
.composer-wrap { position: relative; max-width: 760px; width: 100%; margin: 0 auto; padding: 0 20px 14px; }
.peek { position: absolute; left: 50%; bottom: calc(100% - 12px); width: 120px; transform: translate(-50%, 0); pointer-events: none; transition: opacity .4s, transform .5s cubic-bezier(.2, .8, .2, 1); animation: peekIn 1s .5s cubic-bezier(.2, .8, .2, 1) both; }
.has-messages .peek { opacity: 0; transform: translate(-50%, 30px); }
@keyframes peekIn { from { transform: translate(-50%, 70px); opacity: 0; } }
.composer { position: relative; display: flex; align-items: flex-end; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 8px; box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.composer textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1rem; line-height: 1.5; padding: 8px 6px; max-height: 160px; }
.composer textarea::placeholder { color: var(--muted); }
.send { width: 40px; height: 40px; flex: none; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; transition: background .15s, transform .1s, opacity .2s; }
.send:hover:not(:disabled) { background: var(--accent-strong); }
.send:active:not(:disabled) { transform: scale(.9); }
.send:disabled { opacity: .35; cursor: default; }
.disclaimer { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 10px; }

.toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: .9rem; font-weight: 700; opacity: 0; pointer-events: none; transition: .3s; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Tablet ---------- */
@media (max-width: 1024px) { :root { --sidebar-w: 250px; } }

/* ---------- Celular ---------- */
@media (max-width: 768px) {
  .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; width: min(300px, 86vw); transform: translateX(-102%); box-shadow: var(--shadow); }
  .app.open .sidebar { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(20, 30, 22, .4); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .app.open .scrim { opacity: 1; pointer-events: auto; }
  .only-mobile { display: grid; }
  .topbar { padding: 10px 14px; }
  .chat, .composer-wrap { padding-left: 14px; padding-right: 14px; }
  .peek { width: 96px; bottom: calc(100% - 10px); }
  .msg .bubble { max-width: 92%; }
}
@media (max-width: 420px) {
  .suggestions { grid-template-columns: 1fr; }
  .disclaimer { font-size: .72rem; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* =========================================================
   Capa de acabado visual
   ========================================================= */
.app { position: relative; z-index: 1; }
body { background: var(--bg); }

/* Fondo decorativo: manchas suaves + puntitos */
.bg-deco { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
  background-image: radial-gradient(color-mix(in srgb, var(--accent) 22%, transparent) 1.2px, transparent 1.4px);
  background-size: 26px 26px; }
.bg-deco i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
.bg-deco .b1 { width: 420px; height: 420px; background: #cfe0b8; top: -120px; right: -80px; }
.bg-deco .b2 { width: 360px; height: 360px; background: #e6e9b0; bottom: -100px; left: 22%; animation-delay: -6s; }
.bg-deco .b3 { width: 300px; height: 300px; background: #b9d3bd; top: 38%; right: 18%; opacity: .35; animation-delay: -11s; }
[data-theme="dark"] .bg-deco i { opacity: .16; }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.1); } }

/* Barra lateral y barra superior */
.sidebar { background: color-mix(in srgb, var(--sidebar) 88%, transparent); backdrop-filter: blur(14px); }
.brand-logo { filter: drop-shadow(0 3px 0 color-mix(in srgb, var(--accent) 25%, transparent)); transition: transform .3s; }
.brand:hover .brand-logo { transform: rotate(-6deg) scale(1.08); }
.search { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 9px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; color: var(--muted); transition: border-color .2s, box-shadow .2s; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: .92rem; color: var(--ink); }
.history { margin-top: 12px; }
.history-title { margin-top: 12px; }
.history-title:first-child { margin-top: 0; }
.topbar { backdrop-filter: blur(10px); }
.status { box-shadow: 0 2px 0 var(--line); }

/* Título de bienvenida */
.welcome h1 { background: linear-gradient(120deg, var(--accent-strong), var(--accent) 55%, #9bb98c); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; padding-bottom: .08em; }
.tagline { font-weight: 600; }
.ask { position: relative; }
.ask::after { content: ""; display: block; width: 56px; height: 4px; border-radius: 4px; background: var(--accent); margin: 14px auto 0; opacity: .6; }

/* Tarjetas */
.card { padding: 14px 16px; border-radius: 20px; box-shadow: 0 3px 0 var(--line); }
.card-txt { display: flex; flex-direction: column; line-height: 1.25; }
.card-txt small { color: var(--muted); font-weight: 600; font-size: .82rem; }
.card-ico { width: 44px; height: 44px; border-radius: 14px; color: var(--accent-strong); transition: background .2s, color .2s, transform .25s; }
.card:hover { box-shadow: 0 3px 0 var(--accent), var(--shadow); }
.card:hover .card-ico { background: var(--accent); color: #fff; transform: rotate(-8deg) scale(1.06); }
.card:active { box-shadow: 0 0 0 var(--accent); }

/* Mensajes */
.msg.user .bubble { box-shadow: 0 3px 0 var(--accent-strong); }
.msg.ai .bubble { box-shadow: 0 3px 0 var(--line); }
.msg .ai-ava { border: 1.5px solid var(--line); background: var(--surface); }
.msg .copy { align-self: flex-end; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .2s, background .15s; }
.msg:hover .copy, .msg .copy:focus-visible { opacity: 1; }
.msg .copy:hover { background: var(--accent-soft); color: var(--accent-strong); }
@media (hover: none) { .msg .copy { opacity: .7; } }

/* Caja de texto */
.composer { border-radius: 24px; border-width: 2px; }
.send { border-radius: 16px; box-shadow: 0 3px 0 var(--accent-strong); }
.send:active:not(:disabled) { box-shadow: 0 0 0 var(--accent-strong); transform: translateY(2px); }
.send:disabled { box-shadow: none; }
.peek { filter: drop-shadow(0 4px 10px rgba(80, 110, 84, .18)); }
.peek { animation: peekIn 1s .5s cubic-bezier(.2, .8, .2, 1) both, bob 5s 1.6s ease-in-out infinite; }
@keyframes bob { 50% { margin-bottom: 5px; } }

/* Barras de desplazamiento */
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::selection { background: var(--accent); color: #fff; }

@media (max-width: 420px) {
  .card { padding: 10px 14px; border-radius: 18px; }
  .card-ico { width: 38px; height: 38px; }
  .suggestions { gap: 9px; }
  .ask { margin: 26px 0 16px; }
}

const $ = (id) => document.getElementById(id);
const app = $("app"), input = $("input"), sendBtn = $("sendBtn");
const messages = $("messages"), chat = $("chat"), welcome = $("welcome");
const history = $("history"), toast = $("toast"), menuPop = $("menuPop");

// ---------- 3. ESTADO Y CHAT ----------
let conversaciones = CHATS_EJEMPLO.map((c) => ({ ...c, mensajes: [...c.mensajes] }));
let filtro = "";
let actual = null; // chat nuevo aún sin título

function mostrarAviso(texto) {
  toast.textContent = texto;
  toast.classList.add("show");
  clearTimeout(mostrarAviso.t);
  mostrarAviso.t = setTimeout(() => toast.classList.remove("show"), 2200);
}

function dibujarHistorial() {
  history.querySelectorAll(".chat-item, .history-title").forEach((e) => e.remove());
  let grupoPrevio = null;
  conversaciones.forEach((c, i) => {
    if (filtro && !c.titulo.toLowerCase().includes(filtro)) return;
    const g = c.grupo || "Hoy";
    if (g !== grupoPrevio) {
      const t = document.createElement("p");
      t.className = "history-title"; t.textContent = g;
      history.appendChild(t); grupoPrevio = g;
    }
    const b = document.createElement("button");
    b.className = "chat-item" + (c === actual ? " active" : "");
    b.textContent = c.titulo;
    b.onclick = () => abrirChat(i);
    history.appendChild(b);
  });
}

function abrirChat(i) {
  actual = conversaciones[i];
  messages.innerHTML = "";
  actual.mensajes.forEach((m) => agregarMensaje(m.rol, m.texto, false));
  actualizarVista();
  dibujarHistorial();
  app.classList.remove("open");
}

function nuevoChat() {
  actual = null;
  messages.innerHTML = "";
  actualizarVista();
  dibujarHistorial();
  app.classList.remove("open");
  input.focus();
}

function actualizarVista() {
  const hayMensajes = messages.children.length > 0;
  welcome.hidden = hayMensajes;
  app.classList.toggle("has-messages", hayMensajes);
  document.querySelector(".composer-wrap").classList.toggle("has-messages", hayMensajes);
}

function agregarMensaje(rol, texto, animar = true) {
  const m = document.createElement("div");
  m.className = "msg " + rol;
  if (!animar) m.style.animation = "none";
  if (rol === "ai") m.innerHTML = '<div class="ai-ava"><img src="'+LOGO_S+'" alt=""></div>';
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = texto; // textContent evita inyectar HTML
  m.appendChild(b);
  if (rol === "ai") {
    const cp = document.createElement("button");
    cp.className = "copy"; cp.title = "Copiar respuesta"; cp.setAttribute("aria-label", "Copiar respuesta");
    cp.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
    cp.onclick = () => { navigator.clipboard?.writeText(b.textContent); mostrarAviso("Respuesta copiada"); };
    m.appendChild(cp);
  }
  messages.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

async function enviar(texto) {
  texto = texto.trim();
  if (!texto) return;

  if (!actual) {
    actual = { grupo: "Hoy", titulo: texto.length > 34 ? texto.slice(0, 34) + "…" : texto, mensajes: [] };
    conversaciones.unshift(actual);
  }
  actual.mensajes.push({ rol: "user", texto });
  agregarMensaje("user", texto);
  actualizarVista();
  dibujarHistorial();
  input.value = ""; autoAjustar(); sendBtn.disabled = true;

  // Indicador "escribiendo…"
  const burbuja = agregarMensaje("ai", "");
  burbuja.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

  const respuesta = await obtenerRespuesta(texto);
  burbuja.textContent = respuesta;
  actual.mensajes.push({ rol: "ai", texto: respuesta });
  chat.scrollTop = chat.scrollHeight;
}

// ---------- 4. ★ AQUÍ SE CONECTARÁ LA API ----------
// Hoy devuelve una respuesta ficticia después de una pausa.
// Más adelante, reemplazá el contenido de esta función por una llamada
// a tu API (fetch) y devolvé el texto de la respuesta.
async function obtenerRespuesta(textoUsuario) {
  await new Promise((r) => setTimeout(r, 1100 + Math.random() * 700));
  const t = textoUsuario.toLowerCase();
  const hallada = RESPUESTAS_DEMO.find((r) => t.includes(r.clave));
  return hallada ? hallada.texto : TEXTOS.respuestaGenerica;
}

// ---------- 5. INTERFAZ ----------
function autoAjustar() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}
input.addEventListener("input", () => { autoAjustar(); sendBtn.disabled = !input.value.trim(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) enviar(input.value); }
});
sendBtn.onclick = () => enviar(input.value);

document.querySelectorAll(".card").forEach((c) =>
  c.addEventListener("click", () => enviar(c.dataset.prompt)));

$("newChat").onclick = nuevoChat;
$("attachBtn").onclick = () => mostrarAviso(TEXTOS.adjuntoAviso);
$("settingsBtn").onclick = () => mostrarAviso(TEXTOS.configAviso);
$("profileBtn").onclick = () => mostrarAviso(TEXTOS.perfilAviso);

$("searchInput").addEventListener("input", (e) => { filtro = e.target.value.trim().toLowerCase(); dibujarHistorial(); });

// Barra lateral en celular
$("openSidebar").onclick = () => app.classList.add("open");
$("closeSidebar").onclick = () => app.classList.remove("open");
$("scrim").onclick = () => app.classList.remove("open");

// Menú de opciones
$("menuBtn").onclick = (e) => { e.stopPropagation(); menuPop.hidden = !menuPop.hidden; };
document.addEventListener("click", () => (menuPop.hidden = true));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { menuPop.hidden = true; app.classList.remove("open"); } });

menuPop.addEventListener("click", (e) => {
  const acc = e.target.dataset.action;
  if (!acc) return;
  if (acc === "theme") {
    const oscuro = document.documentElement.dataset.theme === "dark";
    document.documentElement.dataset.theme = oscuro ? "light" : "dark";
  } else if (acc === "clear") {
    if (actual) { conversaciones = conversaciones.filter((c) => c !== actual); }
    nuevoChat();
  } else if (acc === "rename") {
    if (!actual) return mostrarAviso("Primero escribí un mensaje.");
    const n = prompt("Nuevo nombre del chat:", actual.titulo);
    if (n && n.trim()) { actual.titulo = n.trim(); dibujarHistorial(); }
  } else {
    mostrarAviso("Función de demostración.");
  }
});

// Inicio
dibujarHistorial();
actualizarVista();

</script>
